<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>neptuneOS test harness</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="stylesheet" href="css/setup.css">
  <style>#results { position: fixed; top: 0; left: 0; z-index: 99999; background: #fff; color: #000; font: 12px monospace; padding: 8px; max-height: 80vh; overflow: auto; }</style>
</head>
<body>
  <div id="results"></div>
  <div id="boot-screen"><div class="boot-inner"><div class="boot-bar"><div class="boot-bar-fill"></div></div></div></div>
  <div id="shutdown-screen" hidden>
    <div class="shutdown-inner">
      <div class="shutdown-text">It's now safe to turn off your computer.</div>
      <button class="btn" id="restart-btn">Restart</button>
    </div>
  </div>
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="icon-layer"></div>
    <div id="selection-box"></div>
    <div id="window-layer"></div>
    <div id="context-menu" hidden></div>
  </div>
  <div id="taskbar">
    <button id="start-btn"><img src="assets/icons/neptuneos.svg"><span>Start</span></button>
    <div id="task-list"></div>
    <div id="tray"><button class="tray-btn" id="fullscreen-btn"><img src="assets/icons/fullscreen.svg"></button><div id="clock">--:--</div></div>
  </div>
  <div id="start-menu" hidden></div>
  <div id="dialog-layer" hidden></div>

  <script src="js/core/fs.js"></script>
  <script src="js/core/wav.js"></script>
  <script src="js/core/sfx.js"></script>
  <script src="js/core/wm.js"></script>
  <script src="js/core/fullscreen.js"></script>
  <script src="js/core/touchmouse.js"></script>
  <script src="js/core/taskbar.js"></script>
  <script src="js/core/startmenu.js"></script>
  <script src="js/core/desktop.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/explorer.js"></script>
  <script src="js/apps/paint.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/recyclebin.js"></script>
  <script src="js/apps/mediaplayer.js"></script>
  <script src="js/apps/snake.js"></script>
  <script src="js/apps/pacman.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/solitaire.js"></script>
  <script src="js/apps/minesweeper.js"></script>
  <script src="js/apps/stickynotes.js"></script>
  <script src="js/apps/clock.js"></script>
  <script src="js/apps/taskmanager.js"></script>
  <script src="js/apps/store.js"></script>
  <script src="js/core/dock.js"></script>
  <script src="js/core/tablet.js"></script>
  <script src="js/core/neptunai.js"></script>
  <script src="js/core/bloat.js"></script>
  <script src="js/core/hardware.js"></script>
  <script src="js/main.js"></script>
  <script>window.__skipSetup = true;</script>
  <script src="js/setup.js"></script>
  <script>
    const results = [];
    const ok = (name, cond) => results.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : "  <-- check me"));
    const A = () => window.__retroos;
    const render = () => {
      const el = document.getElementById("results");
      el.innerHTML = "<b>" + results.filter((r) => r.startsWith("PASS")).length + " passed / " + results.filter((r) => r.startsWith("FAIL")).length + " failed</b><br>" + results.join("<br>");
      document.title = "TITLEMARKER " + results.filter((r) => r.startsWith("FAIL")).length + " FAILURES";
    };

    window.addEventListener("load", () => {
      setTimeout(async () => {
        try {
          const OS = A();
          ok("OS global present", !!OS && !!OS.fs && !!OS.wm);

          /* music seeded at boot */
          const songs = ["pixel-dreams.wav", "dial-up-lullaby.wav", "the-startup-chime.wav", "floppy-disc-fandango.wav", "screensaver-sunset.wav"];
          ok("all 5 songs seeded", songs.every((s) => OS.fs.exists("/C:/Users/Guest/Music/" + s)));
          ok("song data is wav data-url", OS.fs.read("/C:/Users/Guest/Music/pixel-dreams.wav").startsWith("data:audio/wav;base64,"));
          ok("wav generator produces data url", (OS.wav.dataUrl("the-startup-chime.wav") || "").startsWith("data:audio/wav;base64,"));
          ok("wav seed idempotent", OS.wav.seed() === 0);

          /* fs */
          ok("default tree exists", OS.fs.exists("/C:/Users/Guest/Documents/readme.txt"));
          ok("mkdir works", OS.fs.mkdir("/C:/Users/Guest/Documents/__testdir").ok);
          ok("ls lists new dir", OS.fs.ls("/C:/Users/Guest/Documents").includes("__testdir"));
          ok("write/read roundtrip", OS.fs.write("/C:/Users/Guest/Documents/__test.txt", "hello").ok && OS.fs.read("/C:/Users/Guest/Documents/__test.txt") === "hello");
          ok("trash moves to bin", OS.fs.trash("/C:/Users/Guest/Documents/__test.txt").ok && OS.fs.exists("/C:/Recycle Bin/__test.txt") && !OS.fs.exists("/C:/Users/Guest/Documents/__test.txt"));
          ok("rmdir empty dir", OS.fs.rm("/C:/Users/Guest/Documents/__testdir").ok && !OS.fs.exists("/C:/Users/Guest/Documents/__testdir"));

          /* window manager */
          const w = OS.wm.createWindow({ title: "TESTWIN", width: 400, height: 300 });
          ok("window created", !!w.el && w.el.isConnected);
          ok("window active", w === OS.wm.active);
          ok("taskbar button", !!document.querySelector('.window-task[data-win-id="' + w.id + '"]'));
          w.minimize();
          ok("minimize hides", w.el.style.display === "none" || w.el.classList.contains("window-minimizing"));
          w.restore();
          ok("restore shows", w.el.style.display !== "none");
          w.maximize();
          ok("maximized class", w.el.classList.contains("maximized"));
          w.restore();
          ok("restored size", !w.el.classList.contains("maximized"));
          w.close();
          ok("closed removed", !w.el.isConnected || w.el.classList.contains("window-closing"));

          /* apps launch */
          const apps = ["terminal", "notepad", "explorer", "paint", "calculator", "settings", "recycle", "mediaplayer", "snake", "pacman", "browser", "minesweeper", "stickynotes", "clock", "taskmanager", "store"];
          apps.forEach((id) => {
            OS.apps[id].launch();
            const wc = OS.wm.windows[OS.wm.windows.length - 1];
            ok("launch " + id + " opens window", wc && wc.el.isConnected && wc.title.length > 0);
          });

          /* terminal commands */
          const termWin = OS.wm.windows.find((x) => x.app === "terminal");
          const term = termWin.content.querySelector(".terminal");
          const type = (s) => {
            for (const ch of s) {
              term.dispatchEvent(new KeyboardEvent("keydown", { key: ch, bubbles: true }));
            }
          };
          type("dir");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          const outText = term.textContent;
          ok("terminal dir lists Documents", outText.includes("Documents"));
          type("cd Documents");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          type("dir");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal cd + dir lists readme", term.textContent.includes("readme.txt"));
          type("help");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal help works", term.textContent.includes("HELP command-name"));
          type("whoami");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal whoami", term.textContent.toLowerCase().includes("neptuneos\\guest"));
          type("ver");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal version branded", term.textContent.includes("NeptuneOS [Version 5.1.2600]"));
          type("music");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal music opens player", !!OS.wm.windows.find((x) => x.app === "mediaplayer"));
          type("beep");
          term.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
          ok("terminal beep outputs", term.textContent.includes("BEEP"));

          /* calculator logic via DOM */
          const calcWin = OS.wm.windows.find((x) => x.app === "calculator");
          const display = calcWin.content.querySelector("#calc-display");
          const press = (k) => calcWin.content.querySelector('[data-k="' + k + '"]').click();
          press("7"); press("+"); press("5"); press("=");
          ok("calculator 7+5=12", display.textContent === "12");

          /* paint canvas exists */
          const paintWin = OS.wm.windows.find((x) => x.app === "paint");
          ok("paint canvas 800x520", paintWin.content.querySelector("#paint-canvas") && paintWin.content.querySelector("#paint-canvas").width === 800);

          /* recycle bin lists trashed item */
          const recWin = OS.wm.windows.find((x) => x.app === "recycle");
          ok("recycle bin lists __test.txt", recWin.content.querySelector(".recycle-list").textContent.includes("__test.txt"));

          /* media player playlist */
          const mpWin = OS.wm.windows.find((x) => x.app === "mediaplayer");
          ok("media player playlist shows 5 tracks", mpWin.content.querySelectorAll(".player-track").length === 5);
          ok("media player single instance", OS.apps.mediaplayer.launch() === mpWin);
          ok("start menu has Media Player", document.getElementById("start-menu").textContent.includes("Media Player"));
          ok("start menu has Games section", document.getElementById("start-menu").textContent.includes("Games"));
          ok("start menu has Snake + Pacman", document.getElementById("start-menu").textContent.includes("Snake") && document.getElementById("start-menu").textContent.includes("Pacman"));
          ok("desktop has Media Player icon", document.getElementById("icon-layer").textContent.includes("Media Player"));
          ok("desktop has Pacman icon", document.getElementById("icon-layer").textContent.includes("Pacman"));
          ok("desktop has Browser icon", document.getElementById("icon-layer").textContent.includes("Browser"));
          ok("shutdown screen hidden on boot", document.getElementById("shutdown-screen").hidden);

          /* dock */
          ok("dock API present", !!OS.dock && typeof OS.dock.show === "function");
          ok("dock element created", !!document.querySelector(".dock-wrap"));
          OS.dock.show();
          ok("dock show works", !document.querySelector(".dock-wrap").classList.contains("hidden"));
          ok("dock has app items", document.querySelectorAll(".dock-item").length >= 8);
          OS.dock.hide();
          ok("dock hide works", document.querySelector(".dock-wrap").classList.contains("hidden"));

          /* tablet mode */
          ok("tablet API present", !!OS.tablet && typeof OS.tablet.setEnabled === "function");
          OS.tablet.setEnabled(true);
          ok("tablet enable adds class", document.body.classList.contains("tablet-mode"));
          ok("tablet enable shows dock", !document.querySelector(".dock-wrap").classList.contains("hidden"));
          OS.tablet.setEnabled(false);
          ok("tablet disable removes class", !document.body.classList.contains("tablet-mode"));

          /* browser app */
          const brWin = OS.wm.windows.find((x) => x.app === "browser");
          ok("browser window has URL bar", !!brWin.content.querySelector(".browser-url"));
          ok("browser has nav buttons", brWin.content.querySelectorAll("[data-nav]").length >= 4);
          ok("browser has iframe", !!brWin.content.querySelector("iframe"));
          ok("browser has bookmarks", brWin.content.querySelectorAll(".browser-bm-btn").length >= 3);
          ok("browser has new tab btn", !!brWin.content.querySelector('[data-nav="newtab"]'));

          /* games render */
          const snakeWin = OS.wm.windows.find((x) => x.app === "snake");
          ok("snake canvas renders", !!snakeWin.content.querySelector("#snake-canvas") && snakeWin.content.querySelector("#snake-canvas").width === 384);
          ok("snake score shows", snakeWin.content.textContent.includes("Score: 0"));
          const pacWin = OS.wm.windows.find((x) => x.app === "pacman");
          ok("pacman canvas renders", !!pacWin.content.querySelector("#pac-canvas") && pacWin.content.querySelector("#pac-canvas").width === 304);

          /* minesweeper */
          const msWin = OS.wm.windows.find((x) => x.app === "minesweeper");
          ok("minesweeper has grid", !!msWin.content.querySelector(".ms-grid-wrap"));
          ok("minesweeper has face button", !!msWin.content.querySelector(".ms-face-wrap"));
          ok("minesweeper has mine counter", !!msWin.content.querySelector(".ms-counter"));

          /* sticky notes */
          const snWin = OS.wm.windows.find((x) => x.app === "stickynotes");
          ok("sticky notes has textarea", !!snWin.content.querySelector("textarea"));
          ok("sticky notes has color buttons", snWin.content.querySelectorAll("button").length >= 4);

          /* clock */
          const clkWin = OS.wm.windows.find((x) => x.app === "clock");
          ok("clock has canvas", !!clkWin.content.querySelector("canvas"));
          ok("clock has digital display", !!clkWin.content.querySelector("#clock-digital"));

          /* start menu has new apps */
          ok("start menu has Minesweeper", document.getElementById("start-menu").textContent.includes("Minesweeper"));
          ok("start menu has Solitaire", document.getElementById("start-menu").textContent.includes("Solitaire"));
          ok("start menu has Clock", document.getElementById("start-menu").textContent.includes("Clock"));
          ok("start menu has Sticky Notes", document.getElementById("start-menu").textContent.includes("Sticky Notes"));
          ok("desktop has Minesweeper icon", document.getElementById("icon-layer").textContent.includes("Minesweeper"));
          ok("desktop has Clock icon", document.getElementById("icon-layer").textContent.includes("Clock"));

          /* control panel has new pages */
          const cpWin = OS.wm.windows.find((x) => x.app === "settings");
          ok("control panel has Display page", cpWin.content.textContent.includes("Display"));
          ok("control panel has Sound page", cpWin.content.textContent.includes("Sound"));
          ok("control panel has Network page", cpWin.content.textContent.includes("Network"));
          ok("control panel has Add/Remove", cpWin.content.textContent.includes("Add/Remove"));
          ok("control panel has Bundled Apps", cpWin.content.textContent.includes("Bundled Apps"));

          /* bloatware */
          ok("bloat API present", !!OS.bloat && typeof OS.bloat.init === "function");
          ok("activate watermark present", !!document.getElementById("activate-watermark"));

          /* neptunai */
          ok("neptunai API present", !!OS.neptunai && typeof OS.neptunai.init === "function");

          /* hardware simulation */
          ok("hardware API present", !!OS.hardware && typeof OS.hardware.getCPU === "function");
          ok("hardware CPU is number", typeof OS.hardware.getCPU() === "number");
          ok("hardware RAM is number", typeof OS.hardware.getRAM() === "number");
          ok("hardware GPU is number", typeof OS.hardware.getGPU() === "number");
          ok("hardware total RAM is 640KB", OS.hardware.getTotalRAM() === "640 KB");
          ok("hardware CPU history", Array.isArray(OS.hardware.getCPUHistory()) && OS.hardware.getCPUHistory().length > 0);

          /* task manager */
          const tmWin = OS.wm.windows.find((x) => x.app === "taskmanager");
          ok("task manager has process table", !!tmWin.content.querySelector("#tm-processes") || !!tmWin.content.querySelector("table") || tmWin.content.textContent.includes("Task Manager"));

          /* store */
          const stWin = OS.wm.windows.find((x) => x.app === "store");
          ok("store has app cards", stWin.content.textContent.includes("Neptune Store"));

          /* desktop has new icons */
          ok("desktop has Task Manager icon", document.getElementById("icon-layer").textContent.includes("Task Manager"));
          ok("desktop has Neptune Store icon", document.getElementById("icon-layer").textContent.includes("Neptune Store"));

          /* XP theme + fullscreen + touch mouse */
          ok("XP face palette applied", getComputedStyle(document.documentElement).getPropertyValue("--face").trim() === "#ece9d8");
          ok("dialog layer not blocking when hidden", getComputedStyle(document.getElementById("dialog-layer")).display === "none");
          ok("fullscreen API present", !!OS.fullscreen && typeof OS.fullscreen.toggle === "function");
          ok("fullscreen tray button present", !!document.getElementById("fullscreen-btn"));
          ok("touch mouse API present", !!OS.touchmouse && typeof OS.touchmouse.clickAt === "function" && typeof OS.touchmouse.rightClickAt === "function");
          const probeBtn = document.createElement("button");
          probeBtn.id = "probe-btn";
          probeBtn.style.position = "fixed";
          probeBtn.style.left = "10px";
          probeBtn.style.top = "10px";
          probeBtn.style.width = "50px";
          probeBtn.style.height = "50px";
          document.body.appendChild(probeBtn);
          const bootEl = document.getElementById("boot-screen");
          if (bootEl) bootEl.remove(); /* headless never fires animationend */
          let clicks = 0, menus = 0;
          probeBtn.addEventListener("click", () => clicks++);
          probeBtn.addEventListener("contextmenu", (e) => { e.preventDefault(); menus++; });
          OS.touchmouse.clickAt(35, 35);
          ok("touch left click fires click", clicks === 1);
          OS.touchmouse.rightClickAt(35, 35);
          ok("touch right click fires contextmenu", menus === 1);
          OS.touchmouse._ensureCursor();
          ok("virtual cursor exists", !!document.getElementById("virtual-cursor"));
          probeBtn.remove();

          /* clicking a track loads audio into the player element */
          const mpTrack = mpWin.content.querySelector(".player-track");
          mpTrack.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          const mpAudio = mpWin.content.querySelector("audio");
          ok("play sets audio src", mpAudio.src.startsWith("data:audio/wav"));
          ok("now-playing title set", /Now Playing/.test(mpWin.title));

          /* audio really decodes and has a duration */
          const aTest = new Audio(OS.wav.dataUrl("floppy-disc-fandango.wav"));
          aTest.preload = "auto";
          let aDone = false;
          const aFinish = (name, cond) => { if (aDone) return; aDone = true; ok(name, cond); render(); };
          aTest.addEventListener("loadedmetadata", () => aFinish("audio decodes + has duration", isFinite(aTest.duration) && aTest.duration > 0 && !aTest.error));
          aTest.addEventListener("error", () => aFinish("audio decodes + has duration", false));
          setTimeout(() => aFinish("audio decodes + has duration", false), 8000);

          /* dialog */
          OS.message("T", "hello dialog");
          ok("dialog shows", !document.getElementById("dialog-layer").hidden && document.getElementById("dialog-layer").textContent.includes("hello dialog"));
          document.getElementById("dialog-layer").querySelector("button").click();
          ok("dialog closes", document.getElementById("dialog-layer").hidden);

          /* setup wizard (OOBE) */
          ok("setup API present", !!OS.setup && typeof OS.setup.launch === "function" && !OS.setup.done());
          OS.setup.launch();
          ok("setup wizard opens", !!document.getElementById("setup-overlay"));
          ok("setup welcome step", document.getElementById("setup-overlay").textContent.includes("Welcome to NeptuneOS Setup"));
          document.getElementById("setup-next").click();
          ok("setup license step", document.getElementById("setup-overlay").textContent.includes("LICENSE AGREEMENT"));
          document.querySelector('input[name="eula"][value="accept"]').checked = true;
          document.getElementById("setup-next").click();
          ok("setup personal step", !!document.getElementById("setup-name"));
          document.getElementById("setup-name").value = "TestUser";
          document.getElementById("setup-pass").value = "secret";
          document.getElementById("setup-pass2").value = "secret";
          document.getElementById("setup-next").click();
          ok("setup datetime step", !!document.getElementById("setup-tz"));
          document.getElementById("setup-cancel").click();
          const yesBtn = Array.prototype.find.call(document.querySelectorAll("#dialog-layer button"), (b) => b.textContent.trim() === "Yes");
          ok("setup cancel confirms", !!yesBtn);
          if (yesBtn) yesBtn.click();
          await new Promise((r) => setTimeout(r, 50));
          ok("setup closes on cancel", !document.getElementById("setup-overlay"));
          ok("setup saves user name", OS.setup.userName() === "TestUser");

          /* logon screen */
          OS.setup._showLogon();
          ok("logon screen shows", !!document.getElementById("logon-screen"));
          ok("logon shows user name", document.getElementById("logon-screen").textContent.includes("TestUser"));
          const logonEl2 = document.getElementById("logon-screen");
          if (logonEl2) logonEl2.remove();
        } catch (err) {
          results.push("EXCEPTION: " + err.message + "\n" + (err.stack || ""));
        }
        render();
      }, 2500);
    });
  </script>
</body>
</html>
